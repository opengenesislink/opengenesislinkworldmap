name: WorldMap PHP CI
on:
  push:
  pull_request:
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Syntax check
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Geometry checks
        run: php tests/geometry.php
